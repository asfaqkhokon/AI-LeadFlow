services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-leadflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n_postgres_password
      POSTGRES_DB: n8n

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: ai-leadflow-mysql
    restart: unless-stopped

    environment:
      # Keep these credentials because your existing
      # mysql_data volume was initialized with them.
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: n8n
      MYSQL_USER: n8n
      MYSQL_PASSWORD: n8n_password

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - n8n
        - -pn8n_password
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-leadflow-n8n
    restart: unless-stopped

    ports:
      - "5678:5678"

    environment:
      # n8n internal database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n_postgres_password

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/

      TZ: Asia/Dhaka
      GENERIC_TIMEZONE: Asia/Dhaka

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  mysql_data:
